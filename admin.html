<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم — ضد السينما !؟</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- تم إلغاء شاشة تسجيل الدخول وفتح لوحة التحكم مباشرة -->
    <div id="login-box" style="display: none;"></div>

    <div id="dashboard-box" style="display: block; padding: 20px;">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>لوحة التحكم — ضد السينما !؟</h2>
            <button id="logout" class="danger" style="padding: 8px 15px; cursor: pointer;">تحديث الصفحة</button>
        </header>

        <div id="stats" style="margin-bottom: 20px; font-weight: bold; color: #555;"></div>

        <aside style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn" data-tab="dashboard">الرئيسية</button>
            <button class="btn" data-tab="issues">الأعداد</button>
            <button class="btn" data-tab="articles">المقالات</button>
            <button class="btn" data-tab="sections">الأقسام</button>
            <button class="btn" data-tab="team">هيئة التحرير</button>
            <button class="btn" data-tab="settings">الإعدادات</button>
        </aside>

        <main id="workspace">
            <!-- محتوى لوحة التحكم يظهر هنا تلقائياً -->
        </main>
    </div>

    <!-- استدعاء مكتبة Supabase وملف التشغيل -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
