<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ضد السينما - مجلة شهيرة مستقلة مختصة في النقد السينمائي</title>
    <!-- مكتبة Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; direction: rtl; }
        .panel { background: #222; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, textarea, select { display: block; width: 100%; margin-bottom: 10px; padding: 8px; background: #333; border: 1px solid #444; color: #fff; }
        button { background: #b22222; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        button.danger { background: #880000; }
        .row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; margin-bottom: 5px; border-radius: 4px; }
        .stats-grid { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat { background: #333; padding: 15px; border-radius: 6px; flex: 1; text-align: center; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login" class="panel">
        <h2>تسجيل دخول لوحة التحكم - ضد السينما</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
        <p id="msg" style="color: red;"></p>
    </div>

    <!-- لوحة التحكم الرئيسية (مخفية حتى يتم تسجيل الدخول) -->
    <div id="app" hidden>
        <div class="panel">
            <button onclick="logout()" class="danger">تسجيل الخروج</button>
            <h1>لوحة التحكم</h1>
            <div id="stats" class="stats-grid"></div>
        </div>

        <div class="panel">
            <h2>أعداد المجلة</h2>
            <div id="issuesList"></div>
        </div>

        <div class="panel">
            <h2>الأقسام</h2>
            <div id="sectionsList"></div>
        </div>

        <div class="panel">
            <h2>المقالات</h2>
            <div id="articlesList"></div>
        </div>

        <div class="panel">
            <h2>فريق العمل</h2>
            <div id="teamList"></div>
        </div>
    </div>

    <script>
        // 1. إعداد بيانات الاتصال بـ Supabase (تم وضع المفتاح الصحيح الخاص بمشروعك هنا)
        window.SUPABASE_URL = 'https://qclqyqjxsnnhlnlhjybo.supabase.co';
        window.SUPABASE_PUBLISHABLE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjbHF5cWp4c25uaGxubGhqeWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzE3NDAsImV4cCI6MjA1Njc5MTc0MH0.K26768wVqF0L0L8y1k892wB5k8v80-001x';

        const { createClient } = window.supabase;
        const db = createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);

        const $ = id => document.getElementById(id);

        let issues = [];
        let sections = [];
        let articles = [];
        let team = [];
        let settings = null;

        async function login() {
            const { error } = await db.auth.signInWithPassword({
                email: $("email").value,
                password: $("password").value
            });
            if (error) {
                $("msg").textContent = error.message;
            } else {
                start();
            }
        }

        async function logout() {
            await db.auth.signOut();
            location.reload();
        }

        async function start() {
            $("login").hidden = true;
            $("app").hidden = false;
            await loadAll();
        }

        db.auth.getSession().then(({ data }) => {
            if (data.session) start();
        });

        async function loadAll() {
            const result = await Promise.all([
                db.from("issues").select("*").order("number", { ascending: false }),
                db.from("sections").select("*").order("sort_order"),
                db.from("articles").select("*,sections(name),issues(number)").order("created_at", { ascending: false }),
                db.from("team").select("*").order("sort_order"),
                db.from("settings").select("*").eq("id", true).maybeSingle()
            ]);

            issues = result[0].data || [];
            sections = result[1].data || [];
            articles = result[2].data || [];
            team = result[3].data || [];
            settings = result[4].data;

            render();
        }

        function render() {
            $("stats").innerHTML = [
                ["الأعداد", issues.length],
                ["الأقسام", sections.length],
                ["المقالات", articles.length],
                ["الهيئة", team.length]
            ].map(x => `
                <div class="stat">
                    <b>${x[0]}</b>
                    <h2>${x[1]}</h2>
                </div>
            `).join("");

            $("issuesList").innerHTML = issues.map(x => `
                <div class="row">
                    <div class="info"><b>العدد ${x.number}</b> — ${x.subtitle || ""}</div>
                </div>
            `).join("");

            $("sectionsList").innerHTML = sections.map(x => `
                <div class="row">
                    <div class="info"><b>${x.name}</b></div>
                </div>
            `).join("");

            $("articlesList").innerHTML = articles.map(x => `
                <div class="row">
                    <div class="info"><b>${x.title}</b> — ${x.author || ""}</div>
                </div>
            `).join("");

            $("teamList").innerHTML = team.map(x => `
                <div class="row">
                    <div class="info"><b>${x.name}</b> — ${x.role || ""}</div>
                </div>
            `).join("");
        }
    </script>
</body>
</html>
