<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ترجمة مسبقة</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#111;color:#eee}
  h1{font-size:20px;margin:0 0 8px}
  #bar{height:10px;background:#333;border-radius:5px;overflow:hidden;margin:12px 0}
  #fill{height:100%;width:0;background:#e63946;transition:width .3s}
  #status{font-size:15px;margin-bottom:10px}
  #log{white-space:pre-wrap;direction:ltr;text-align:left;font:12px/1.5 monospace;background:#000;color:#0f0;padding:10px;border-radius:6px;max-height:55vh;overflow:auto}
  button{font-size:16px;padding:12px 18px;border:0;border-radius:6px;background:#e63946;color:#fff}
</style>
</head>
<body>
<h1>الترجمة المسبقة للمقالات</h1>
<p>اترك هذه الصفحة مفتوحة والشاشة مضاءة. ما يُترجم يُحفظ في Supabase، ولو توقفت يمكنك فتحها لاحقًا فتكمل من حيث توقفت.</p>
<button id="go">ابدأ الترجمة</button>
<div id="bar"><div id="fill"></div></div>
<div id="status">في الانتظار</div>
<pre id="log"></pre>

<!-- مكتبة supabase: إن كان index.html عندك يستعمل رابطًا آخر فاستعمل نفس الرابط هنا -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // نمنع app.js من ترجمة هذه الصفحة عند تحميلها
  try { localStorage.setItem('cc-lang', 'ar'); } catch (e) {}
</script>
<script src="app.js"></script>
<script>
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const fillEl = document.getElementById('fill');
  const log = m => {
    logEl.textContent = new Date().toTimeString().slice(0, 8) + ' ' + m + '\n' + logEl.textContent;
  };
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function keepAwake() {
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  async function translateArticle(article, lang) {
    // العنوان والتصنيف
    await translateText(article.title || '', lang, null, 3);
    await translateText(article.category || 'نقد سينمائي', lang, null, 3);

    // النص: نعيد المحاولة حتى يكتمل
    const raw = String(article.content || '');
    if (!raw.trim()) return true;
    for (let attempt = 1; attempt <= 12; attempt++) {
      await translateWholeArticle(raw, lang, article.id);
      if (!translateWholeArticle.incomplete) return true;
      log('ناقص، إعادة بعد 40 ثانية (محاولة ' + attempt + ')');
      await wait(40000);
    }
    return false;
  }

  async function run() {
    document.getElementById('go').disabled = true;
    keepAwake();
    const all = await get('articles', 'sort_order', true);
    const articles = all.filter(x => x.visible !== false);
    const langs = ['fr', 'en'];
    const total = articles.length * langs.length;
    let done = 0, failed = [];
    log('عدد المقالات: ' + articles.length);

    for (const lang of langs) {
      await loadSharedTranslations(lang);
      for (const article of articles) {
        statusEl.textContent = lang.toUpperCase() + ' — ' + done + '/' + total + ' — ' + (article.title || '').slice(0, 40);
        log(lang + ' ← ' + (article.title || article.id));
        let ok = false;
        try { ok = await translateArticle(article, lang); } catch (e) { log('خطأ: ' + e); }
        if (!ok) { failed.push(lang + ':' + article.id); log('لم يكتمل: ' + article.id); }
        done++;
        fillEl.style.width = Math.round(done / total * 100) + '%';
      }
    }
    await wait(4000); // لتفريغ طابور حفظ الترجمات
    statusEl.textContent = failed.length
      ? 'انتهت الجولة، وبقي ' + failed.length + ' ناقصًا. أعد فتح الصفحة وابدأ مجددًا.'
      : 'اكتملت ترجمة كل المقالات ✔';
    log(statusEl.textContent);
    document.getElementById('go').disabled = false;
  }

  document.getElementById('go').onclick = run;
</script>
</body>
</html>
