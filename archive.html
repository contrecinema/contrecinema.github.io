<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف المقالات - ضد السينما</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="top">
        <div class="topline">
            <div class="wrap topin">
                <a class="brand" href="index.html">
                    <small>CONTRE CINÉMA</small>
                </a>
                <nav id="nav">
                    <a href="index.html">الرئيسية</a>
                    <a href="archive.html">أرشيف المقالات</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="wrap" style="padding: 40px 20px;">
        <h1 style="margin-bottom: 30px; font-size: 24px; border-bottom: 2px solid #333; padding-bottom: 10px;">أرشيف المقالات</h1>
        
        <!-- عرض المقالات مباشرة وبدون أي أزرار فلترة معقدة -->
        <div id="articles-container">
            <p>جاري تحميل المقالات...</p>
        </div>
    </main>

    <script>
        // إعدادات الاتصال بـ Supabase
        const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co'; // تأكد من إبقاء رابط مشروعك الصحيح إذا كان موجداً مسبقاً
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // مفتاحك الصحيح
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadAllArticles() {
            const container = document.getElementById('articles-container');
            
            // جلب جميع المقالات مرتبطة من الأحدث للأقدم دون فلترة
            const { data: articles, error } = await supabase
                .from('articles')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = '<p>حدث خطأ أثناء تحميل المقالات.</p>';
                return;
            }

            if (!articles || articles.length === 0) {
                container.innerHTML = '<p>لا توجد مقالات منشورة حالياً.</p>';
                return;
            }

            // عرض المقالات بنفس تصميم المقالات العادي
            container.innerHTML = articles.map(article => `
                <article style="margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px;">
                    <h2 style="margin: 0 0 10px 0; font-size: 20px;">
                        <a href="article.html?id=${article.id}" style="text-decoration: none; color: #111;">${article.title}</a>
                    </h2>
                    <p style="color: #555; font-size: 14px; line-height: 1.6; margin: 0;">${article.excerpt || ''}</p>
                </article>
            `).join('');
        }

        loadAllArticles();
    </script>
</body>
</html>
