<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف المقالات - ضد السينما</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="top">
        <div class="topline">
            <div class="wrap topin">
                <a class="brand" href="index.html">
                    <small>CONTRE CINÉMA</small>
                </a>
                <nav id="nav">
                    <a href="index.html">الرئيسية</a>
                    <a href="archive.html">أرشيف المقالات</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="wrap" style="padding: 40px 20px;">
        <h1 style="margin-bottom: 30px; font-size: 24px; border-bottom: 2px solid #333; padding-bottom: 10px;">أرشيف المقالات</h1>
        
        <!-- حاوية جلب وعرض جميع المقالات -->
        <div id="articles-container">
            <p>جاري تحميل المقالات...</p>
        </div>
    </main>

    <!-- سكريبت لجلب كافة المقالات مباشرة من Supabase المستخدَم في app.js -->
    <script>
        async function loadArchiveArticles() {
            const container = document.getElementById('articles-container');
            
            try {
                // استخدام supabase المعرّف مسبقاً أو جلبها مباشرة عبر نفس مفاتيح مشروعك
                const SUPABASE_URL = 'https://zvvugttrhchfxxzofjeb.supabase.co';
                // بما أننا سنعتمد على جلب البيانات مباشرة، نستخدم نفس طريقة app.js:
                const { data: articles, error } = await window.supabase ? 
                    window.supabase.from('articles').select('*').order('created_at', { ascending: false }) : 
                    { data: null, error: true };

                if (error || !articles) {
                    // طريقة بديلة للتأكد من جلب البيانات لو كان الاتصال يتم عبر app.js
                    container.innerHTML = '<p>جлу تحميل المقالات... يرجى التأكد من الاتصال.</p>';
                    return;
                }

                if (articles.length === 0) {
                    container.innerHTML = '<p>لا توجد مقالات منشورة حالياً.</p>';
                    return;
                }

                // عرض جميع المقالات دفعة واحدة بدون فلاتر
                container.innerHTML = articles.map(article => `
                    <article style="margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px;">
                        <h2 style="margin: 0 0 10px 0; font-size: 20px;">
                            <a href="article.html?id=${article.id}" style="text-decoration: none; color: #111;">${article.title}</a>
                        </h2>
                        <p style="color: #555; font-size: 14px; line-height: 1.6; margin: 0;">${article.excerpt || ''}</p>
                    </article>
                `).join('');

            } catch (err) {
                container.innerHTML = '<p>حدث خطأ أثناء تحميل الأرشيف.</p>';
            }
        }

        // تنفيذ الدالة عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', loadArchiveArticles);
    </script>
    
    <!-- ربط ملف app.js إن احتجته للوظائف الأخرى -->
    <script src="app.js"></script>
</body>
</html>
