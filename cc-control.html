<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>دخول الإدارة | ضد السينما !؟</title>

  <meta name="robots" content="noindex, nofollow, noarchive">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">

  <link rel="apple-touch-icon" href="assets/icon-180.png">

  <meta name="theme-color" content="#eb3c01">

  <link rel="stylesheet" href="admin.css">

  <script>
    // الثيم: يُطبَّق قبل رسم الصفحة (نفس مفتاح الموقع)
    (function () {
      var t = null;
      try { t = localStorage.getItem('cc-theme'); } catch (e) {}
      if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
    function ccThemeToggle() {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('cc-theme', next); } catch (e) {}
    }
  </script>
</head>

<body>

  <div id="login" class="login">

    <div class="login-box">

      <img class="logo-img" src="assets/logo.png" alt="ضد السينما !؟">

      <p>تسجيل الدخول إلى لوحة التحكم</p>

      <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
      >

      <button class="login-theme-toggle" onclick="ccThemeToggle()" aria-label="تبديل الوضع الليلي والنهاري" title="تبديل الوضع الليلي والنهاري">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 14.2A8.6 8.6 0 1 1 9.8 3.4a7 7 0 0 0 10.8 10.8z"/></svg>
      </button>

      <button id="loginBtn">
        دخول
      </button>

      <div id="msg"></div>

      <a href="index.html">
        ← العودة إلى الموقع
      </a>

    </div>

  </div>


  <div id="panel" hidden>

    <header>

      <div>
        <strong class="head-brand"><img class="head-logo" src="assets/logo.png" alt="">لوحة تحكم</strong>
        <small id="stats"></small>
      </div>

      <div class="head-side">
        <button class="theme-toggle" onclick="ccThemeToggle()" aria-label="تبديل الوضع الليلي والنهاري" title="تبديل الوضع الليلي والنهاري">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 14.2A8.6 8.6 0 1 1 9.8 3.4a7 7 0 0 0 10.8 10.8z"/></svg>
        </button>
        <button id="logout">
          تسجيل الخروج
        </button>
      </div>

    </header>


    <div class="layout">

      <aside>

        <button data-tab="dashboard">
          نظرة عامة
        </button>

        <button data-tab="issues">
          الأعداد
        </button>

        <button data-tab="articles">
          المقالات
        </button>

        <button data-tab="sections">
          الأقسام
        </button>

        <button data-tab="team">
          هيئة التحرير
        </button>

        <button data-tab="editors">
          المحررون
        </button>

        <button data-tab="settings">
          إعدادات الواجهة
        </button>

        <a href="index.html" target="_blank">
          فتح الموقع ↗
        </a>

      </aside>


      <main id="workspace"></main>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="admin.js"></script>

</body>
</html>
