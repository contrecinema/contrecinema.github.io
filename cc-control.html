<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>دخول الإدارة | ضد السينما !؟</title>

  <meta name="robots" content="noindex, nofollow, noarchive">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <div id="login" class="login">

    <div class="login-box">

      <div class="logo">ضد السينما !؟</div>

      <p>تسجيل الدخول إلى لوحة التحكم</p>

      <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
      >

      <button id="loginBtn">
        دخول
      </button>

      <div id="msg"></div>

      <a href="index.html">
        ← العودة إلى الموقع
      </a>

    </div>

  </div>


  <div id="panel" hidden>

    <header>

      <div>
        <strong>لوحة تحكم ضد السينما !؟</strong>
        <small id="stats"></small>
      </div>

      <button id="logout">
        تسجيل الخروج
      </button>

    </header>


    <div class="layout">

      <aside>

        <button data-tab="dashboard">
          نظرة عامة
        </button>

        <button data-tab="issues">
          الأعداد
        </button>

        <button data-tab="articles">
          المقالات
        </button>

        <button data-tab="sections">
          الأقسام
        </button>

        <button data-tab="team">
          هيئة التحرير
        </button>

        <button data-tab="settings">
          إعدادات الواجهة
        </button>

        <a href="index.html" target="_blank">
          فتح الموقع ↗
        </a>

      </aside>


      <main id="workspace"></main>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="admin.js"></script>

</body>
</html>
